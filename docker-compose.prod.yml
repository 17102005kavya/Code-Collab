version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - REDIS_URL=redis://redis:6379
      # Will read SUPABASE_URL and SUPABASE_KEY from the .env file dynamically
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    restart: always
